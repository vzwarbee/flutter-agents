name: agent_flutter_skills package

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'packages/agent_flutter_skills/**'
      - 'skills/**'
      - 'templates/AGENTS.md'
      - 'tool/generate_bundled_files.mjs'
      - 'pubspec.yaml'
      - '.github/workflows/agent_flutter_skills_pub.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/agent_flutter_skills/**'
      - 'skills/**'
      - 'templates/AGENTS.md'
      - 'tool/generate_bundled_files.mjs'
      - 'pubspec.yaml'
      - '.github/workflows/agent_flutter_skills_pub.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: npm run check:dart-assets
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed packages/agent_flutter_skills
      - run: dart analyze --fatal-infos packages/agent_flutter_skills
      - run: dart test packages/agent_flutter_skills
      - run: dart pub -C packages/agent_flutter_skills publish --dry-run
